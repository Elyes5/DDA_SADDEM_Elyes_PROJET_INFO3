name: Deploy Backend to Infomaniak

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Non-sensitive repo variables
      HOST_USER: ${{ vars.HOST_USER }}
      HOST_REPOSITORY: ${{ vars.HOST_REPOSITORY }}
      FLASK_ENV: ${{ vars.FLASK_ENV }}
      HOST_EMAIL: ${{ vars.HOST_EMAIL }}
    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      # 3️⃣ Build and push backend Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./cubicle-be
          push: true
          tags: |
            ghcr.io/${{ vars.HOST_USER }}/${{ vars.HOST_REPOSITORY }}:latest
            ghcr.io/${{ vars.HOST_USER }}/${{ vars.HOST_REPOSITORY }}:${{ github.sha }}

      # 4️⃣ Set up kubectl
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      # 5️⃣ Configure kubeconfig from GitHub Secret
      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig
          kubectl get nodes

      # 6️⃣ Create Kubernetes imagePullSecret for GHCR
      - name: Create imagePullSecret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GHCR_PAT }} \
            --docker-email=${{ vars.HOST_EMAIL }}\
            --dry-run=client -o yaml | kubectl apply -f -

      # 7️⃣ Deploy backend to Kubernetes
      - name: Deploy backend
        run: |
          kubectl set image deployment/backend \
            backend=ghcr.io/${{ vars.HOST_USER }}/${{ vars.HOST_REPOSITORY }}:${{ github.sha }}
          
          # Ensure Kubernetes uses the imagePullSecret
          kubectl patch deployment backend \
            -p '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"ghcr-secret"}]}}}}'

          # Wait for rollout to complete
          kubectl rollout status deployment/backend
