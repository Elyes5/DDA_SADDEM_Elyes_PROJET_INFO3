version: "3.9"

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: mysql://mysql:mysql@db:3306/app_db
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app_db
      MYSQL_USER: mysql
      MYSQL_PASSWORD: mysql
    ports:
      - "3306:3306"
