apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: ghcr.io/elyes5/dda_saddem_elyes_projet_info3:latest
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: ca-volume
              mountPath: "/etc/ssl/certs/db-ca"
              readOnly: true
          envFrom:
            - secretRef:
                name: backend-secrets
          env:
            - name: FLASK_ENV
              value: production
            - name: DB_CA_PATH
              value: "/etc/ssl/certs/db-ca/ca.pem"
      volumes:
        - name: ca-volume
          secret:
            secretName: db-ca-secret
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - api.cubicleapp.tech
      secretName: cubicleapp-tls
  rules:
    - host: api.cubicleapp.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 80
