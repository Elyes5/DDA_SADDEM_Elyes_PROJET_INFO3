apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: ghcr.io/elyes5/dda_saddem_elyes_projet_info3:latest
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: ca-volume
              mountPath: "/etc/ssl/certs/db-ca"
              readOnly: true
          envFrom:
            - secretRef:
                name: backend-secrets
          env:
            - name: FLASK_ENV
              value: production
            - name: DB_CA_PATH
              value: "/etc/ssl/certs/db-ca/ca.pem"
      volumes:
        - name: ca-volume
          secret:
            secretName: db-ca-secret
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 80         # Port exposé par le service dans le cluster
      targetPort: 5000 # Port sur lequel Flask écoute
  type: ClusterIP      # ClusterIP suffit car l'Ingress gère l'accès externe
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    # Optionnel : décommentez la ligne suivante si vous installez cert-manager pour le SSL
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  rules:
  - host: cubicle.micad0.fr
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 80