<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Define gradients -->
    <defs>
        <linearGradient id="cubeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="topFace" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- 3D Cube -->
    <g transform="translate(200, 180)">
        <!-- Left face -->
        <path d="M -80,-46.2 L -80,46.2 L 0,92.4 L 0,0 Z"
              fill="url(#cubeGradient)"
              stroke="#1e3a8a"
              stroke-width="2"/>

        <!-- Right face -->
        <path d="M 0,0 L 0,92.4 L 80,46.2 L 80,-46.2 Z"
              fill="url(#rightFace)"
              stroke="#1e3a8a"
              stroke-width="2"/>

        <!-- Top face -->
        <path d="M 0,-92.4 L -80,-46.2 L 0,0 L 80,-46.2 Z"
              fill="url(#topFace)"
              stroke="#1e3a8a"
              stroke-width="2"/>

        <!-- Code bubble icon on right face center -->
        <g transform="translate(40, 23) skewY(-30) scale(1.5)">
            <!-- Chat bubble background -->
            <rect x="-16" y="-12" width="32" height="22" rx="4" fill="white"/>
            <path d="M -4,10 L 0,16 L 4,10 Z" fill="white"/>

            <!-- Code brackets inside bubble -->
            <text x="0" y="2"
                  font-family="monospace"
                  font-size="18"
                  font-weight="bold"
                  fill="#2563eb"
                  text-anchor="middle">
                &lt;/&gt;
            </text>
        </g>
    </g>

    <!-- App name -->
    <text x="200" y="320"
          font-family="'Mark Pro', 'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif"
          font-size="46"
          font-weight="400"
          fill="#1e40af"
          text-anchor="middle"
          letter-spacing="2">
        CUBICLE
    </text>
</svg>